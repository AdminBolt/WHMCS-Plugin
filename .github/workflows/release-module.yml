name: Release module to get.adminbolt.com

# Pushing a tag vMAJOR.MINOR.PATCH packages the module from that tag, creates a
# GitHub release with the zip, and publishes it to get.adminbolt.com in the
# same run.
#
# One workflow on purpose: a release created with GITHUB_TOKEN does not trigger
# other workflows, so a separate "on: release" publisher would never start.
#
# The publish job runs the deployment script from the default branch, never
# from the tag: the root SSH key must only ever run reviewed code.
#
# Set MODULE below per repository: bolt-blesta, bolt-upmind or bolt-whmcs.
# Needs GET_DEPLOY_SSH_KEY and GET_KNOWN_HOSTS (organisation secrets shared with
# this repository, or secrets of the get-adminbolt environment), and access to
# the self-hosted adminbolt-ci runner group.
#
# If publishing fails after the release was created, do not delete or move the
# tag: fix the cause and run "Republish module to get.adminbolt.com" for it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: publish-get-module
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODULE: bolt-whmcs

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::refusing tag '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Package
        run: ./scripts/package-module.sh "$MODULE" "${{ steps.v.outputs.version }}" . dist
      - name: Create the release (draft until both assets are uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/$MODULE-$VERSION.zip" "dist/$MODULE-$VERSION.zip.sha256" \
            --draft --verify-tag \
            --title "$MODULE $TAG" \
            --notes "Download: https://get.adminbolt.com/downloads/$MODULE/$TAG/$MODULE-$VERSION.zip"
          gh release edit "$TAG" --draft=false

  publish:
    needs: package
    runs-on: [self-hosted, adminbolt-ci]
    environment: get-adminbolt
    permissions:
      contents: read
    container:
      image: debian:bookworm-slim
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_GET_SSH: root@37.27.40.58
      PUBLISH_GET_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Install the deployment tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg jq rsync openssh-client unzip git
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh
      - name: Check out the deployment script from the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Configure SSH
        env:
          GET_DEPLOY_SSH_KEY: ${{ secrets.GET_DEPLOY_SSH_KEY }}
          GET_KNOWN_HOSTS: ${{ secrets.GET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${GET_DEPLOY_SSH_KEY:-}" ] || { echo "::error::GET_DEPLOY_SSH_KEY is not available to this repository"; exit 1; }
          [ -n "${GET_KNOWN_HOSTS:-}" ] || { echo "::error::GET_KNOWN_HOSTS is not available to this repository"; exit 1; }
          install -d -m 700 /tmp/ssh
          printf '%s\n' "$GET_DEPLOY_SSH_KEY" > /tmp/ssh/id_ed25519
          chmod 600 /tmp/ssh/id_ed25519
          printf '%s\n' "$GET_KNOWN_HOSTS" > /tmp/ssh/known_hosts
          echo "PUBLISH_GET_SSH_OPTS=-i /tmp/ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o UserKnownHostsFile=/tmp/ssh/known_hosts" >> "$GITHUB_ENV"
      - name: Publish
        env:
          TAG: ${{ needs.package.outputs.tag }}
        run: ./scripts/publish-module-get.sh "$MODULE" "$TAG"
      - name: Roll back on failure
        if: failure() || cancelled()
        run: |
          [ -f /tmp/ssh/id_ed25519 ] || exit 0
          ./scripts/publish-module-get.sh "$MODULE" --rollback "$PUBLISH_GET_RUN_ID" || true
      - name: Remove the SSH key
        if: always()
        run: rm -rf /tmp/ssh
